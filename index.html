<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="CSS/default.css" id='stylesheet'>
    <meta name="description" content="A Jeopardy-style trivia board for three to five players, with timed questions and saved games.">
    <title>Jeopardy</title>
  </head>
  <body id="mainBody">
    <div id="context-menu" class="context-menu">
      <button type="button" id="edit-context-menu">Edit Player Name</button>
      <button type="button" id="reset-player-name">Reset Player Name</button>
      <button type="button" id="cancel-context-menu">Cancel</button>
    </div>
    <div id="popup" role="status" aria-live="polite"></div>
    <dialog id="name-editor" aria-labelledby="name-title">
      <form id="name-form">
        <h2 id="name-title">Edit player name</h2>
        <label for="name-input">Name (up to 10 characters)</label>
        <input id="name-input" name="player-name" maxlength="10" required autocomplete="off">
        <div class="name-actions"><button type="button" id="cancel-name">Cancel</button><button type="submit">Save name</button></div>
      </form>
    </dialog>
    <div class="settings">
      <div class="bar-menu">
        <button type="button" class="icon toolbar-button" id="menu-button" aria-label="Settings Menu"><svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 24 24" width="48px" height="48px"><g id="surface24793741"><path style="stroke:none;fill-rule:nonzero;fill:rgb(100%,100%,100%);fill-opacity:1;" d="M 2 5 L 2 7 L 22 7 L 22 5 Z M 2 11 L 2 13 L 22 13 L 22 11 Z M 2 17 L 2 19 L 22 19 L 22 17 Z M 2 17 "/><title>Settings Menu</title></g></svg></button>
        <button type="button" class="icon toolbar-button" id="mute-button" aria-label="Mute Audio"><svg aria-hidden="true" focusable="false" viewBox="0 0 48 48" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" height="48" width="48"><path d="M30.1 40.85q-.8.25-1.45-.25-.65-.5-.65-1.35 0-.4.225-.725.225-.325.625-.425 4.55-1.6 7.35-5.45t2.8-8.7q0-4.85-2.8-8.725T28.85 9.8q-.4-.1-.625-.45Q28 9 28 8.6q0-.85.675-1.325T30.1 7.05q5.35 1.9 8.625 6.525Q42 18.2 42 23.95t-3.275 10.375Q35.45 38.95 30.1 40.85ZM7.5 30q-.65 0-1.075-.425Q6 29.15 6 28.5v-9q0-.65.425-1.075Q6.85 18 7.5 18H14l7.45-7.45q.7-.7 1.625-.325Q24 10.6 24 11.6v24.8q0 1-.925 1.375t-1.625-.325L14 30ZM27 32.4V15.55q2.7.85 4.35 3.2Q33 21.1 33 24q0 2.95-1.65 5.25T27 32.4Zm-6-16.8L15.35 21H9v6h6.35L21 32.45ZM16.3 24Z"/><title>Mute Audio</title></svg></button>
        <button type="button" class="icon toolbar-button" id="unmute-button" aria-label="Unmute Audio" style="display:none;"><svg aria-hidden="true" focusable="false" viewBox="0 0 48 48" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" height="48" width="48"><path d="m39.55 44.1-5.5-5.5q-1 .7-2.075 1.275-1.075.575-2.225.975-.8.25-1.45-.25-.65-.5-.65-1.35 0-.4.225-.725.225-.325.625-.425.9-.3 1.775-.7.875-.4 1.625-.95l-8.25-8.3v8.25q0 1-.925 1.375T21.1 37.45L13.65 30h-6.5q-.65 0-1.075-.425-.425-.425-.425-1.075v-9q0-.65.425-1.075Q6.5 18 7.15 18h6.3L3.5 8.05q-.45-.45-.425-1.075Q3.1 6.35 3.55 5.9 4 5.45 4.6 5.45q.6 0 1.05.45l36.1 36.05q.45.45.45 1.075t-.45 1.075q-.45.45-1.1.45-.65 0-1.1-.45Zm-9.8-37.05q5.35 1.9 8.625 6.525Q41.65 18.2 41.65 23.95q0 2.55-.7 5t-2.1 4.65l-2.15-2.15q1-1.7 1.475-3.6.475-1.9.475-3.9 0-4.95-2.775-8.9T28.5 9.75q-.4-.1-.625-.425Q27.65 9 27.65 8.6q0-.85.675-1.325t1.425-.225ZM18.6 23.15Zm13.55 3.75-4.5-4.5v-6.5Q30 17 31.325 19.2q1.325 2.2 1.325 4.8 0 .75-.125 1.475-.125.725-.375 1.425Zm-8.5-8.5-5.2-5.2 2.65-2.65q.7-.7 1.625-.325.925.375.925 1.375Zm-3 14.3v-7.5l-4.2-4.2h-7.8v6h6.3Z"/><title>Unmute Audio</title></svg></button>
        <button type="button" class="icon toolbar-button" id="eidt-mode-icon" aria-label="Edit Mode" style="display:none;"><svg aria-hidden="true" focusable="false" viewBox="0 0 48 48" fill="#ffffff" height="48" width="48"><path d="M9 39h2.2l22.15-22.15-2.2-2.2L9 36.8Zm30.7-24.3-6.4-6.4 2.1-2.1q.85-.85 2.1-.85t2.1.85l2.2 2.2q.85.85.85 2.1t-.85 2.1Zm-2.1 2.1L12.4 42H6v-6.4l25.2-25.2Zm-5.35-1.05-1.1-1.1 2.2 2.2Z"/><title>Edit Mode</title></svg></button>
        <button type="button" class="icon toolbar-button" id="double-points-icon" aria-label="Double Points" style="display:none;"><svg aria-hidden="true" focusable="false" viewBox="0 0 48 48" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" height="48" width="48"><path d="M16.45 43.55q-.4-.4-.45-1-.05-.6.3-1.05L26 28 9.8 26.45q-1.3-.1-1.725-1.35-.425-1.25.575-2.1L29.4 4.4q.45-.45 1.075-.425.625.025 1.075.475.4.4.45 1 .05.6-.3 1.05L22 20l16.2 1.55q1.3.1 1.725 1.35.425 1.25-.575 2.1L18.6 43.6q-.45.45-1.075.425Q16.9 44 16.45 43.55Z"/><title>Double Points</title></svg></button>
        <p class="icon text-icon" id="question-length-icon"></p>

      </div>
      <div id="settingsContainer">
      <div class="settings-menu">
        <p class="settings-header">Settings Menu</p>
        <div class="settings-container top">
          <!--first settings box-->
          <div class="flex-container flex-top">
            <div class="settings-option">
              <u title="click to enable edit mode">Edit Mode</u>
            </div>
            <div class="toggle-button">
              <button type="button" class="settings-toggle-button-two" aria-label="Edit mode" aria-pressed="false">Off</button>
            </div>
          </div>
        </div>
        <div class="settings-container full-round">
          <!--Second settings box-->
          <div class="flex-container flex-middle">
            <div class="settings-option">
              <u title="points are worth twice as much">Double Points</u>
            </div>
            <div class="toggle-button">
              <button type="button" class="settings-toggle-button-three" aria-label="Double points" aria-pressed="false">Off</button>
            </div>
          </div>
        </div>
        <div class="settings-container full-round">
          <!--Third settings box-->
          <div class="flex-container flex-middle">
            <div class="settings-option">
              <u>Player Count</u>
            </div>
            <div class="toggle-button">
              <p><button type="button" id="take_player" aria-label="Remove a player">−</button><b class="player-number-counter" id="player_count"> 3 </b><button type="button" id="add_player" aria-label="Add a player">+</button></p>
            </div>
          </div>
        </div>
        <div class="settings-container full-round">
          <!--Third settings box-->
          <div class="flex-container flex-middle">
            <div class="settings-option">
              <u>Question Length</u>
            </div>
            <div class="toggle-button">
              <p><button type="button" id="take_seconds" aria-label="Decrease question length">−</button><b class="player-number-counter" id="question_length_text"> 15s </b><button type="button" id="add_seconds" aria-label="Increase question length">+</button></p>
            </div>
          </div>
        </div>
        <div class="settings-container bottom">
          <!--Fourth settings box-->
          <div class="flex-container flex-bottom">
            <div class="settings-option">
              <u>Color Theme</u>
            </div>
            <div class="toggle-button">
              <p><button type="button" id="previous-theme" aria-label="Previous theme">&lt;</button><span id="current-theme"> Default </span><button type="button" id="next-theme" aria-label="Next theme">&gt;</button></p>
            </div>
          </div>
        </div>
        <button class="data-button" id="load" title="click to load game">load save</button>
        <button class="data-button" id="delete" title="THIS WILL ERASE ALL SAVED GAME DATA">delete save</button>
        <button class="data-button" id="save" title="click to save game">save game</button>
        <p class="attribution">Questions from <a href="https://the-trivia-api.com/">The Trivia API</a>.</p>
      </div>
    </div>
  </div>
  <main id="main">
      <div class="board-help"><p id="board-status" role="status">Loading questions…</p><button id="retry-questions" type="button" hidden>Retry questions</button></div>
      <table id="player-info-table" class="player-info-table">
        <tbody id="player_names_table">
          <tr id="player_names">
            <th class="headers" id="player1_name">Player 1</th>
            <th class="headers" id="player2_name">Player 2</th>
            <th class="headers" id="player3_name">Player 3</th>
          </tr>
          <tr id="player_score_text">
            <th class="score_boxes p1b" id="player1_score">0</th>
            <th class="score_boxes p2b" id="player2_score">0</th>
            <th class="score_boxes p3b" id="player3_score">0</th>
          </tr>
          <tr class="player-score-buttons" id="player_score_buttons" style="text-align: center">
            <td style="text-align: center">
              <button class="points-button" id="add_p1">ADD</button>
              <button class="points-button" id="take_p1">TAKE</button>
            </td>
            <td>
              <button class="points-button" id="add_p2">ADD</button>
              <button class="points-button" id="take_p2">TAKE</button>
            </td>
            <td>
              <button class="points-button" id="add_p3">ADD</button>
              <button class="points-button" id="take_p3">TAKE</button>
            </td>
          </tr>
        </tbody>
      </table>
  </main>
    <script type="module" src="Scripts/app.js"></script>
  </body>
</html>
